<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя</title>
    <style>
        /* Главный фон сайта — светло-розовый */
        body {
            background-color: #FFE4E1; /* Misty Rose */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Чтобы убегающие кнопки не ломали страницу */
            position: relative;
        }

        /* Центральная розовая вставка */
        .card {
            background-color: #FFF0F5; /* Lavender Blush */
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* Стиль для гифок */
        .card img {
            max-width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        /* Текст на сайте */
        h1 {
            color: #FF1493; /* Deep Pink */
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        p {
            color: #FF69B4;
            font-size: 1.3rem;
            margin: 0 0 25px 0;
            line-height: 1.4;
        }

        /* Контейнер для кнопок */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 80px;
            position: relative;
        }

        /* Общий стиль для всех кнопок */
        .btn {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        /* Кнопка ДА и Позвоню я */
        .btn-yes {
            background-color: #FF69B4;
            color: white;
            z-index: 15;
        }
        .btn-yes:hover {
            background-color: #FF1493;
        }

        /* Кнопка НЕT и Позвонишь ты */
        .btn-no {
            background-color: #F08080;
            color: white;
            position: relative;
            z-index: 20;
        }

        /* Стили для летающих сердечек */
        .heart-trail {
            position: absolute;
            color: #FF1493;
            font-size: 20px;
            pointer-events: none;
            animation: fadeOutHeart 1s forwards ease-out;
            z-index: 5;
        }

        @keyframes fadeOutHeart {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px) scale(0.5);
            }
        }
    </style>
</head>
<body>

    <!-- Главная карточка -->
    <div class="card" id="mainCard">
        <!-- Экран 1: Приглашение на свидание -->
        <div id="step1">
            <img src="https://giphy.com" alt="Котик просит">
            <h1>Дорогая</h1>
            <p>ты пойдешь со мной на свидание?</p>
            <div class="btn-container">
                <button class="btn btn-yes" id="btnYes1" onclick="nextStep(2)">Да!</button>
                <!-- События mouseenter и click заставляют кнопку убегать -->
                <button class="btn btn-no" id="btnNo1" onmouseenter="runAway(this)" onclick="runAway(this)">Нет</button>
            </div>
        </div>

        <!-- Экран 2: Договор о звонке -->
        <div id="step2" style="display: none;">
            <img src="https://giphy.com" alt="Котик радуется">
            <h1>Отлично!</h1>
            <p>созвонимся в 19 по МСК!<br>Позвонишь ты?</p>
            <div class="btn-container">
                <button class="btn btn-yes" id="btnYes2" onclick="nextStep(3)">Позвоню я</button>
                <button class="btn btn-no" id="btnNo2" onmouseenter="runAway(this)" onclick="runAway(this)">Позвонишь ты</button>
            </div>
        </div>

        <!-- Экран 3: Финал -->
        <div id="step3" style="display: none;">
            <img src="https://giphy.com" alt="Котик шлет поцелуй">
            <p>Буду с нетерпеньем ждать, когда услышу твой милый голос! ❤️</p>
        </div>
    </div>

    <script>
        let scaleFactor = 1; // Коэффициент увеличения кнопки "Да"

        // Функция переключения экранов
        function nextStep(step) {
            if (step === 2) {
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                // Сбрасываем размер фактора для следующего экрана, если нужно
                scaleFactor = 1;
            } else if (step === 3) {
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
            }
        }

        // Функция, заставляющая кнопку убегать
        function runAway(button) {
            // Оставляем след из сердечек перед тем, как кнопка переместится
            createHeartTrail(button);

            // Вычисляем случайные координаты на экране
            // Кнопка не уйдет полностью за границы видимости экрана
            const padding = 50;
            const x = Math.random() * (window.innerWidth - button.offsetWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - button.offsetHeight - padding * 2) + padding;

            // Меняем позиционирование кнопки на фиксированное, чтобы двигать по всему экрану
            button.style.position = 'fixed';
            button.style.left = x + 'px';
            button.style.top = y + 'px';

            // Увеличиваем кнопку "Да" на текущем активном экране
            growYesButton();
        }

        // Функция увеличения кнопки "Да"
        function growYesButton() {
            scaleFactor += 0.15; // С каждым разом кнопка больше на 15%
            
            // Находим, какая кнопка "Да" сейчас видна, и увеличиваем её
            const btnYes1 = document.getElementById('btnYes1');
            const btnYes2 = document.getElementById('btnYes2');
            
            if (document.getElementById('step1').style.display !== 'none') {
                btnYes1.style.transform = `scale(${scaleFactor})`;
            } else {
                btnYes2.style.transform = `scale(${scaleFactor})`;
            }
        }

        // Функция создания следа из сердечек
        function createHeartTrail(button) {
            const rect = button.getBoundingClientRect();
            
            // Создаем 5 маленьких сердечек на месте кнопки
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-trail';
                heart.innerHTML = '❤️';
                
                // Небольшой разброс вокруг кнопки
                const offsetX = (Math.random() - 0.5) * 40;
                const offsetY = (Math.random() - 0.5) * 40;
                
                heart.style.left = (rect.left + rect.width / 2 + offsetX) + 'px';
                heart.style.top = (rect.top + rect.height / 2 + offsetY) + 'px';
                
                document.body.appendChild(heart);
                
                // Удаляем сердечко из памяти после завершения анимации
                setTimeout(() => {
                    heart.remove();
                }, 1000);
            }
        }
    </script>
</body>
</html>
